<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שיבוץ עמדות ונוכחות — סדרנים ירושלים</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #0f172a; direction: rtl; }
    header { background: #1e3a5f; color: #fff; padding: 14px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    header h1 { margin: 0; font-size: 19px; }
    .container { max-width: 1180px; margin: 16px auto; padding: 0 14px; }
    .auth-bar { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(15,23,42,0.06); display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    .auth-bar > div { flex: 1; min-width: 200px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #334155; }
    select, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: #fff; }
    button { cursor: pointer; border: none; border-radius: 9px; padding: 11px 16px; font-size: 15px; font-weight: 700; transition: 0.15s; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-wa { background: #15803d; color: #fff; }
    .btn-light { background: #e2e8f0; color: #1e293b; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab-btn { background: #dbe4f0; color: #1e3a5f; padding: 11px 18px; }
    .tab-btn.active { background: #1e3a5f; color: #fff; }
    .alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; font-weight: 600; display: none; }
    .alert.ok { display: block; background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .alert.err { display: block; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .positions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
    .pos-card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 3px 10px rgba(15,23,42,0.07); border-right: 6px solid #16a34a; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
    .pos-card.urgent { border-right-color: #dc2626; }
    .pos-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #dcfce7; color: #166534; }
    .pos-card.urgent .pos-badge { background: #fee2e2; color: #991b1b; }
    .pos-title { font-size: 18px; font-weight: 700; margin: 4px 0; color: #0f172a; }
    .pos-meta { font-size: 14px; color: #475569; line-height: 1.6; }
    .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(15,23,42,0.06); }
    .clock-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
    .clock-btn { padding: 16px; font-size: 17px; width: 100%; }
    .info-panel { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 14px; line-height: 1.6; white-space: pre-line; }
    .worker-pill { background: #eff6ff; border: 1px solid #93c5fd; color: #1e3a8a; padding: 10px 14px; border-radius: 10px; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: right; }
    th { background: #1e3a5f; color: #fff; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>מערכת שיבוץ עמדות ונוכחות — סדרנים ירושלים</h1>
      <div style="font-size: 12px; opacity: 0.9;">כניסה אישית לעובד | שעון נוכחות GPS (250 מ׳) | ממשק מנהל מוגן</div>
    </div>
    <button class="btn-light" onclick="refreshCurrentView()">רענן נתונים</button>
  </header>

  <div class="container">
    <div id="alertBox" class="alert"></div>

    <!-- זיהוי אישי לעובד ללא חשיפת רשימת כלל העובדים -->
    <div id="workerLoginBar" class="auth-bar">
      <div>
        <label>הזן/י את שמך המלא (כניסה אישית)</label>
        <input id="loginNameInput" type="text" placeholder="לדוגמה: ישראל ישראלי" />
      </div>
      <div>
        <label>מספר טלפון (לאימות)</label>
        <input id="loginPhoneInput" type="tel" placeholder="050-0000000" />
      </div>
      <div style="flex: 0 0 auto;">
        <button class="btn-primary" onclick="loginWorker()">כניסה אישית לעובד</button>
      </div>
    </div>

    <div id="loggedInWorkerBanner" class="worker-pill hidden">
      <span id="loggedInWorkerText">מחובר/ת כעת</span>
      <button class="btn-light" onclick="logoutWorker()">החלף משתמש / יציאה</button>
    </div>

    <div class="tabs">
      <button id="btnTabPositions" class="tab-btn active" onclick="showTab('positions')">עמדות פנויות לשיבוץ</button>
      <button id="btnTabClock" class="tab-btn" onclick="showTab('clock')">שעון נוכחות אישי</button>
      <button id="btnTabAdmin" class="tab-btn" onclick="showTab('admin')">ממשק מנהל (מוגן בקוד)</button>
    </div>

    <!-- לשונית 1: פריסה גדולה של מקומות פנויים -->
    <section id="tabPositions">
      <div class="auth-bar" style="margin-bottom: 14px;">
        <div>
          <label>סינון לפי גזרה</label>
          <select id="gizraFilter" onchange="renderPositions()">
            <option value="">כל הגזרות</option>
          </select>
        </div>
        <div>
          <label>חיפוש מוסד / כתובת</label>
          <input id="searchBox" type="text" placeholder="הקלד שם בית ספר או רחוב..." oninput="renderPositions()" />
        </div>
      </div>
      <div id="positionsContainer" class="positions-grid">טוען עמדות פנויות...</div>
    </section>

    <!-- לשונית 2: שעון נוכחות אישי נעול -->
    <section id="tabClock" class="hidden">
      <div class="card">
        <h2>החתמת כניסה ויציאה אישית (ללא עריכת שעה ידנית)</h2>
        <div style="max-width: 420px; margin-bottom: 10px;">
          <label>מוסד שבו את/ה מוצב/ת כעת</label>
          <select id="clockMosad">
            <option value="">-- בחר מוסד --</option>
          </select>
